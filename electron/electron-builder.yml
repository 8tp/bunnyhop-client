appId: lol.bunnyhop.client
productName: Bunnyhop
protocols:
  - name: Bunnyhop links
    schemes: [bunnyhop]
  # Discord starts the client through discord-<application id>:// when a
  # friend presses Join and the client isn't running (main.mjs).
  - name: Discord Join
    schemes: [discord-1556467060916224040]
copyright: Copyright © 2026 Aeperion
# Predictable names for the download page and scripts/release.mjs.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: dist/electron
  buildResources: assets
files:
  - electron/main.mjs
  - electron/process-priority.mjs
  - electron/smoke.mjs
  - electron/update-check.mjs
  - electron/content-cache.mjs
  - electron/coalesced-writer.mjs
  - electron/branding.mjs
  - electron/diagnostics.mjs
  - electron/discord-rpc.mjs
  - electron/run-vault.mjs
  - electron/benchmark.mjs
  - electron/security.mjs
  - electron/game-preload.cjs
  - electron/settings-preload.cjs
  - electron/settings/**
  - electron/policy.mjs
  - electron/settings.mjs
  - electron/window-state.mjs
  - package.json
asar: true
afterPack: electron/after-pack.cjs

# Releases are not OS-signed (docs/releases.md). after-pack.cjs gives the
# macOS bundle an ad hoc seal, which Apple Silicon requires to launch.
mac:
  icon: assets/icon.icns
  category: public.app-category.games
  identity: null
  notarize: false
  target:
    - target: dmg
      arch: [arm64, x64]

win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]

# Per-user one-click install: no administrator prompt, no folder page.
nsis:
  oneClick: true
  perMachine: false
  artifactName: ${productName}-${version}-${os}-${arch}-setup.${ext}
  deleteAppDataOnUninstall: false

linux:
  icon: assets/icon-512.png
  category: Game
  executableName: bunnyhop
  executableArgs: []
  syncDesktopName: true
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]

publish: []
