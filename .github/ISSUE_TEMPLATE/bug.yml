name: Bug report
description: Report a reproducible client problem.
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, follow SECURITY.md privately. Remove personal data from reports and screenshots."
  - type: input
    id: environment
    attributes:
      label: Client version and system
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected result, and actual result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Support report
      description: F10 → Client → Support report → Export. Check it for anything private first.
